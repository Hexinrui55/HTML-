const rooms=[{id:'r1',name:'明德图书馆 · 二层A区',short:'二层A区',building:'明德图书馆',floor:'2F',capacity:24,icon:'📚',desc:'安静学习 · 充电插座 · 空调开放',open:'07:00 - 22:30',type:'静音区'}, {id:'r2',name:'知行楼 · 三层共享自习室',short:'共享自习室',building:'知行楼',floor:'3F',capacity:36,icon:'🏛️',desc:'开放讨论 · 桌面宽敞 · Wi-Fi',open:'08:00 - 22:00',type:'交流区'}, {id:'r3',name:'文心楼 · 一层阅览区',short:'一层阅览区',building:'文心楼',floor:'1F',capacity:28,icon:'☕',desc:'阅读与自习 · 靠窗采光 · 温度适宜',open:'07:30 - 21:30',type:'静音区'}];

const pad=n=>String(n).padStart(2,'0'); function relDate(days){let x=new Date();x.setDate(x.getDate()+days);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};

const selfBookings=()=>data.bookings.filter(b=>b.user==='陈同学').sort((a,b)=>b.id.localeCompare(a.id));
const activeSelf=()=>selfBookings().find(b=>['reserved','checked_in'].includes(b.status));
const allRoomSeatIds=()=>['A','B','C','D'].flatMap(l=>[1,2,3,4,5,6].map(n=>l+pad(n)));
const occupied=(r,seat,date=ui.date,slot=ui.slot)=>data.bookings.find(b=>b.roomId===r&&b.seat===seat&&b.date===date&&b.slot===slot&&['reserved','checked_in'].includes(b.status));
function seatState(seat,room=ui.roomId){if(data.disabled.includes(room+':'+seat))return 'disabled';let b=occupied(room,seat);return b?(b.status==='checked_in'?'using':'busy'):'available'}
function countFree(room){let n=room==='r1'?24:room==='r2'?36:28;let busy=data.bookings.filter(b=>b.roomId===room&&b.date===ui.date&&b.slot===ui.slot&&['reserved','checked_in'].includes(b.status)).length;let disabled=data.disabled.filter(x=>x.startsWith(room+':')).length;return Math.max(0,n-busy-disabled)}
function room(){return rooms.find(r=>r.id===ui.roomId)||rooms[0]};function save(){try{localStorage.setItem('zuoyouxu-demo-v1',JSON.stringify(data))}catch(e){}};

function back(page){return `<button class="back" onclick="go('${page}')">‹</button>`};
function nav(){return `<div class="bottom-nav"><button class="tab ${['home','detail'].includes(ui.page)?'active':''}" onclick="go('home')"><b>⌂</b>首页</button><button class="tab ${['rooms','seats','confirm'].includes(ui.page)?'active':''}" onclick="go('rooms')"><b>▦</b>选座</button><button class="tab ${['bookings','checkin'].includes(ui.page)?'active':''}" onclick="go('bookings')"><b>▣</b>我的</button><button class="tab ${ui.page==='history'?'active':''}" onclick="go('history')"><b>◴</b>记录</button></div>`}
const phead=(t,b='home',right='校园服务')=>`<div class="screen-head">${back(b)}<strong>${t}</strong><span class="round">${right}</span></div>`;
function roomItem(r){return `<div class="card roomcard" onclick="ui.roomId='${r.id}';go('detail')"><div class="room-ill">${r.icon}</div><div style="flex:1"><h4>${r.name}</h4><div class="small">${r.desc}</div><div class="room-bottom"><span class="pill">可约 ${countFree(r.id)} 座</span><strong>查看详情 ›</strong></div></div></div>`}
function home(){return `${phead('座有序 · 校园预约','home','学生端')}<div class="scroller"><div class="scrollpad"><div style="font-size:12px;color:#8293a8;margin-bottom:9px">你好，陈同学 ☀️</div><div class="hero"><small>合理规划时间，让每一次自习更高效</small><h2>找个好位置<br>开始专注学习</h2><button onclick="go('rooms')">立即预约座位 →</button></div><div class="stats"><div class="stat"><strong>3</strong><span>开放自习室</span></div><div class="stat"><strong>88</strong><span>总规划座位</span></div><div class="stat"><strong>72%</strong><span>示例使用率</span></div></div><div class="section-row"><h3>推荐自习室</h3><button class="link" onclick="go('rooms')">查看全部 →</button></div>${rooms.slice(0,2).map(roomItem).join('')}<div class="section-row"><h3>预约须知</h3></div><div class="note">🕒 最早提前96小时预约 · 开始前15分钟可签到 · 逾期15分钟未签到自动释放座位。</div></div></div>${nav()}`}
function roomsPage(){return `${phead('选择自习室')}<div class="scroller"><div class="scrollpad"><div class="search">⌕　搜索教学楼 / 自习室（演示静态筛选）</div><div class="filterrow">${['全部','静音区','交流区'].map(x=>`<button onclick="ui.filter='${x}';render()" class="filter ${ui.filter===x?'active':''}">${x}</button>`).join('')}</div><div style="font-size:11px;color:#8597ae;margin:6px 0 13px">已找到 ${rooms.filter(r=>ui.filter==='全部'||r.type===ui.filter).length} 间可预约自习室</div>${rooms.filter(r=>ui.filter==='全部'||r.type===ui.filter).map(roomItem).join('')}<div class="note" style="margin-top:15px">✨ 当前显示为模拟场馆及数据，实际预约需学校系统对接。</div></div></div>${nav()}`}
function detail(){const r=room();return `${phead('自习室详情','rooms')}<div class="scroller"><div class="scrollpad"><div class="cover">${r.icon}</div><div class="section-row" style="margin-top:15px"><h3>${r.name}</h3><span class="pill">开放中 · 示例</span></div><div class="small">📍 ${r.building} · ${r.floor}　|　${r.type}</div><div style="height:16px"></div><div class="details"><div class="detail">开放时间<b>${r.open}</b></div><div class="detail">座位容量<b>${r.capacity} 个</b></div><div class="detail">当前可约<b>${countFree(r.id)} 个</b></div><div class="detail">区域类型<b>${r.type}</b></div></div><div class="section-row"><h3>空间设施</h3></div><div style="font-size:12px;color:#71849b;line-height:2.1">🔌 充电插座　·　📶 Wi-Fi 网络<br>❄️ 空调开放　·　🔕 安静学习环境</div><div class="section-row"><h3>使用说明</h3></div><div class="note">预约后到场签到，开始时间后15分钟未签到，将自动释放座位；不需要使用时请及时取消。</div></div></div><div class="fixed-actions"><button class="primary full" onclick="go('seats')">选择日期与座位 →</button></div>`}
function datesUI(){return `<div class="dates">${[0,1,2].map((d)=>{let date=relDate(d+1);let dt=new Date(date+'T12:00:00');return `<button class="date ${date===ui.date?'active':''}" onclick="ui.date='${date}';ui.selected='';render()">${['明天','后天','大后天'][d]}<strong>${pad(dt.getMonth()+1)}.${pad(dt.getDate())}</strong></button>`}).join('')}</div>`}
function timesUI(){return `<div class="times">${slots.map(t=>`<button class="time ${ui.slot===t?'active':''}" onclick="ui.slot='${t}';ui.selected='';render()">${t}</button>`).join('')}</div>`}
function seats(){let seat=ui.selected;return `${phead('选择座位','detail','实时规则演示')}<div class="scroller"><div class="scrollpad"><div class="small">${room().name}</div><div class="section-row" style="margin-top:13px"><h3>选择预约日期</h3></div>${datesUI()}<div class="section-row" style="margin-top:7px"><h3>选择时间段</h3></div>${timesUI()}<div class="section-row" style="margin-top:4px"><h3>座位分布</h3><span class="small">剩余 ${countFree(ui.roomId)} 座</span></div><div class="legend"><span><i style="background:#eef3f8;border:1px solid #dbe5ef"></i>可预约</span><span><i style="background:#2d76ee"></i>已选择</span><span><i style="background:#d7dadd"></i>已预约</span><span><i style="background:#ffdfaa"></i>使用中</span></div><div class="card" style="padding:14px 12px"><div style="text-align:center;background:#edf4fa;border-radius:7px;color:#a2b1c1;font-size:10px;padding:8px;margin-bottom:13px">窗 户 · 采 光 区</div>${['A','B','C','D'].map((row,i)=>`<div class="seat-grid">${[1,2,3,4,5,6].map(n=>{let s=row+pad(n);let st=seatState(s);return `<button title="${s} ${st}" class="seat ${st==='available'&&seat===s?'selected':st==='available'?'':st}" onclick="choose('${s}')" ${st!=='available'?'disabled':''}>${s}</button>`}).join('')}</div>${i<3?'<div class="corridor">通　道</div>':''}`).join('')}<div style="text-align:center;color:#9aabbe;font-size:10px;margin-top:15px">入口　↓</div></div><div class="note">请选择灰白色的可用座位；深蓝色表示已选座。示例数据仅用于原型演示。</div></div></div><div class="fixed-actions"><div class="itemrow" style="margin:0 0 9px"><span>已选择座位</span><strong style="color:#2768e8">${seat||'尚未选择'}</strong></div><button ${seat?'':'disabled'} class="primary full" onclick="go('confirm')">下一步 · 确认预约</button></div>`}
function choose(s){if(seatState(s)!=='available'){toast('该座位已不可预约，请选择其他座位');return}ui.selected=s;render()}
function confirm(){return `${phead('确认预约','seats')}<div class="scroller"><div class="scrollpad"><div style="text-align:center;padding:18px 0 20px"><div style="font-size:38px">📍</div><h3 style="margin:9px 0 5px">请核对预约信息</h3><div class="small">确认后系统将检查预约冲突并生成预约记录</div></div><div class="card" style="padding:15px 17px"><div class="itemrow"><span>预约场馆</span><strong>${room().short}</strong></div><div class="itemrow"><span>场馆位置</span><strong>${room().building}</strong></div><div class="itemrow"><span>预约日期</span><strong>${ui.date}</strong></div><div class="itemrow"><span>预约时段</span><strong>${ui.slot}</strong></div><div class="itemrow"><span>座位编号</span><strong style="color:#266ae4;font-size:20px">${ui.selected||'未选择'}</strong></div><div class="itemrow"><span>费用</span><strong>免费</strong></div></div><div class="section-row"><h3>预约规则</h3></div><div class="rule"><b>✓</b><span>预约开始前15分钟起可签到</span></div><div class="rule"><b>✓</b><span>迟到超过15分钟将自动释放座位并记录违约</span></div><div class="rule"><b>✓</b><span>已预约时间段不允许重复预约</span></div><div class="note" style="margin-top:17px">提交前再次检查冲突。此演示版本使用浏览器本地模拟存储。</div></div></div><div class="fixed-actions"><button class="primary full" onclick="submitBooking()">确认预约</button></div>`}
function submitBooking(){if(!ui.selected||seatState(ui.selected)!=='available'){toast('座位状态已发生变化，请重新选座');go('seats');return}if(data.bookings.some(b=>b.user==='陈同学'&&b.date===ui.date&&b.slot===ui.slot&&['reserved','checked_in'].includes(b.status))){toast('同一时段已存在有效预约，请先取消原预约');return}if(selfBookings().filter(b=>b.date>=relDate(0)&&['reserved','checked_in'].includes(b.status)).length>=3){toast('最多同时保留3笔未来预约');return}const id='ZY-'+String(Date.now()).slice(-6);data.bookings.push({id,user:'陈同学',roomId:ui.roomId,seat:ui.selected,date:ui.date,slot:ui.slot,status:'reserved',source:'user'});data.logs.unshift(`${id} 已创建预约`);save();ui.page='bookings';toast('预约成功！已为你生成预约记录')}
function statusPill(x){return {reserved:'<span class="pill blue">待签到</span>',checked_in:'<span class="pill">使用中</span>',completed:'<span class="pill">已完成</span>',cancelled:'<span class="pill gray">已取消</span>',no_show:'<span class="pill red">已违约</span>'}[x]||x}
function bookingBlock(b,actions=true){let r=rooms.find(x=>x.id===b.roomId);return `<div class="booking-main"><div class="booking-top"><div><div style="font-weight:800;font-size:14px">${r.name}</div><div class="small">预约编号 ${b.id}</div></div>${statusPill(b.status)}</div><div class="booking-data"><div class="itemrow"><span>使用时间</span><strong>${b.date}<br>${b.slot}</strong></div><div class="itemrow"><span>座位编号</span><strong>${b.seat}</strong></div>${actions?(b.status==='reserved'?`<div style="display:flex;gap:8px;margin-top:17px"><button class="secondary" style="flex:1" onclick="cancelBooking('${b.id}')">取消预约</button><button class="primary" style="flex:1" onclick="go('checkin')">立即签到</button></div>`:b.status==='checked_in'?`<button class="secondary full" onclick="finishBooking('${b.id}')">结束使用 / 释放座位</button>`:''):''}</div></div>`}
function bookings(){let bs=selfBookings().filter(b=>['reserved','checked_in'].includes(b.status));return `${phead('我的预约','home','学生端')}<div class="scroller"><div class="scrollpad"><div class="section-row" style="margin-top:3px"><h3>当前预约</h3><button class="link" onclick="go('history')">历史记录 →</button></div>${bs.length?bs.map(b=>bookingBlock(b)).join(''):`<div class="empty"><div class="emo">🪑</div><h4>暂无进行中的预约</h4><div class="small">选择心仪的位置，开始今天的学习吧</div><button class="primary" style="margin-top:15px" onclick="go('rooms')">去预约</button></div>`}<div class="section-row"><h3>签到规则</h3></div><div class="note">在预约开始前15分钟至开始后15分钟内可签到。为方便作品展示，交互原型提供“模拟签到”，不依赖真实校园终端。</div></div></div>${nav()}`}
function cancelBooking(id){let b=data.bookings.find(x=>x.id===id);if(!b||b.status!=='reserved')return; if(!confirm('确定取消该预约？取消后座位会重新释放。'))return;b.status='cancelled';save();toast('已取消预约，座位已释放')}
function finishBooking(id){let b=data.bookings.find(x=>x.id===id);if(!b||b.status!=='checked_in')return;b.status='completed';save();toast('已结束本次使用，感谢保持良好的自习习惯')}
function checkin(){let b=activeSelf();return `${phead('签到核销','bookings','演示模式')}<div class="scroller"><div class="scrollpad"><div style="text-align:center;margin:18px 0"><span style="display:inline-grid;place-items:center;width:57px;height:57px;border-radius:50%;background:#edf7ff;color:#2c70e4;font-size:27px">✓</span><h3 style="margin:12px 0 4px">预约签到</h3><div class="small">到达座位后完成签到，即可开始学习</div></div>${b?`<div class="card"><div class="itemrow"><span>自习室</span><strong>${rooms.find(r=>r.id===b.roomId)?.short}</strong></div><div class="itemrow"><span>座位</span><strong>${b.seat}</strong></div><div class="itemrow"><span>时段</span><strong>${b.slot}</strong></div><div class="itemrow"><span>状态</span>${statusPill(b.status)}</div></div><div class="qr"></div><div style="text-align:center;font-size:12px;color:#8b9aad">示意二维码 · 非真实校园核销码</div><div class="steps"><div class="step done"><strong>1</strong>预约成功</div><div class="step ${b.status==='checked_in'?'done':''}"><strong>2</strong>到场签到</div><div class="step"><strong>3</strong>结束使用</div></div><div class="note">⚠️ 模拟签到将跳过真实时间校验，仅用于验证预约状态从“待签到”变为“使用中”。真实产品必须由服务端检查签到时间及身份。</div>`:`<div class="empty">暂无可签到预约<br><button class="secondary" style="margin-top:14px" onclick="go('rooms')">去选座</button></div>`}</div></div><div class="fixed-actions"><button class="primary full" ${!b||b.status==='checked_in'?'disabled':''} onclick="demoCheckin()">${b&&b.status==='checked_in'?'已完成签到':'演示：模拟签到成功'}</button></div>`}
function demoCheckin(){let b=activeSelf();if(!b||b.status!=='reserved'){toast('当前没有待签到预约');return}b.status='checked_in';save();toast('模拟签到成功，状态已更新为使用中')}
function history(){const bs=selfBookings().filter(b=>!['reserved','checked_in'].includes(b.status));return `${phead('预约记录','bookings')}<div class="scroller"><div class="scrollpad"><div class="filterrow"><span class="filter active">全部记录</span><span class="filter">已完成</span><span class="filter">已取消</span></div>${bs.length?bs.map(b=>bookingBlock(b,false)).join(''):`<div class="empty">暂无历史记录</div>`}<div class="note">📂 历史记录展示预约结果与状态，支持面试讲解预约生命周期。</div></div></div>${nav()}`}
function adminShell(title,content){const links=[['dashboard','▦　运营总览'],['seatAdmin','▤　座位管理'],['bookAdmin','◷　预约管理'],['violation','⚠　违约管理']];return `<div class="admin-canvas" id="capture-target"><div class="admin-side"><div class="admin-logo"><span style="font-size:23px">▣</span> 座有序 <small style="font-size:9px;opacity:.5">PRO</small></div><div style="font-size:10px;color:#7f9ab8;padding:0 13px;margin:0 0 12px">工作台</div>${links.map(([p,n])=>`<button class="${ui.page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('')}<div style="position:absolute;bottom:37px;color:#6d87a7;font-size:10px;margin-left:9px">演示系统 · 非真实上线产品</div></div><div class="admin-body"><div class="admin-header"><div><h2>${title}</h2><small>座有序 · 校园自习室运营管理后台</small></div><div class="avatar">2026 模拟学期 <span>管</span> 管理员</div></div>${content}</div></div>`}
function dashboard(){const totalActive=data.bookings.filter(b=>b.status==='reserved'||b.status==='checked_in').length;let content=`<div class="kpis"><div class="kpi"><span>场馆总数</span><strong>03</strong><small>▴ 校园示例场馆</small></div><div class="kpi"><span>规划座位</span><strong>88</strong><small>包含可用与停用</small></div><div class="kpi"><span>有效预约</span><strong>${pad(totalActive)}</strong><small>本地演示实时变化</small></div><div class="kpi"><span>累计违约</span><strong>${pad(data.violations.length)}</strong><small style="color:#e88d59">待处理 ${data.violations.filter(x=>x.status==='待处理').length} 条</small></div></div><div class="admin-grid"><div class="white-panel"><h3>分时段预约趋势 <span class="pill gray" style="float:right">模拟数据</span></h3><div class="bars">${[68,105,96,142,128,155,133].map((h,i)=>`<div class="bar" style="height:${h}px"><label>${['周一','周二','周三','周四','周五','周六','周日'][i]}</label></div>`).join('')}</div><div style="padding-top:34px;color:#a1aebf;font-size:11px">演示数据仅用于验证图表布局与筛选交互</div></div><div class="white-panel"><h3>座位状态分布</h3><div class="donut"></div><div style="font-size:11px;line-height:2.2;color:#8796aa"><span style="color:#2768e8">●</span> 空闲 / 示例　55%<br><span style="color:#19aa89">●</span> 已预约 / 使用　25%<br><span style="color:#f7bd63">●</span> 维护 / 其他　20%</div></div></div><div class="white-panel"><div class="tablebar"><h3>待处理事项</h3><button class="smallbtn" onclick="go('violation')">查看全部 →</button></div><div class="adm-message">⚠ 有 ${data.violations.filter(v=>v.status==='待处理').length} 条预约违约待处理，建议及时核对签到记录。</div><div class="itemrow"><span>管理员建议</span><strong>优先检查冲突与超时未签到记录</strong></div></div>`;return adminShell('管理总览',content)}
function seatAdmin(){const seats=['A01','A02','A03','B01','B02','B03','C01','C02','C03','D04','D05','D06'];let content=`<div class="adm-message">座位维护为模拟操作：存在有效预约的座位不允许直接停用，需先处理预约。</div><div class="tablepanel"><div class="tablebar"><h3>座位状态管理 <span class="pill blue">明德图书馆 · 二层A区</span></h3><div class="inputs"><button class="smallbtn" onclick="toast('此版演示仅支持预设样例座位管理')">＋ 添加座位</button></div></div><table class="data-table"><thead><tr><th>座位编号</th><th>所在区域</th><th>设施</th><th>当前状态</th><th>操作</th></tr></thead><tbody>${seats.map(s=>{const key='r1:'+s;let disabled=data.disabled.includes(key);const occ=data.bookings.find(b=>b.roomId==='r1'&&b.seat===s&&b.date===ui.date&&b.slot===ui.slot&&['reserved','checked_in'].includes(b.status));let state=disabled?'停用维护':occ?'已预约':'正常开放';return `<tr><td><strong style="color:#244771">${s}</strong></td><td>二层A区</td><td>充电插座、独立桌面</td><td>${disabled?'<span class="pill gray">停用维护</span>':occ?'<span class="pill warn">已预约</span>':'<span class="pill">正常开放</span>'}</td><td><button class="smallbtn ${disabled?'':'red'}" onclick="toggleSeat('${s}')">${disabled?'恢复开放':'设为维护'}</button></td></tr>`}).join('')}</tbody></table><div class="pagination"><span>展示 12 / 24 个座位（演示子集）</span><span>当前业务日期：${ui.date} ${ui.slot}</span></div></div>`;return adminShell('座位管理',content)}
function toggleSeat(seat){let key='r1:'+seat;let i=data.disabled.indexOf(key);if(i!==-1){data.disabled.splice(i,1);save();toast(`${seat} 已恢复开放`);return}let booked=data.bookings.some(b=>b.roomId==='r1'&&b.seat===seat&&['reserved','checked_in'].includes(b.status));if(booked){toast('操作被阻止：该座位已有有效预约');return}data.disabled.push(key);save();toast(`${seat} 已设为停用维护`)}
function bookAdmin(){const all=data.bookings.slice().reverse();let content=`<div class="tablepanel"><div class="tablebar"><h3>预约记录列表</h3><div class="inputs"><span class="admin-input">全部状态 ▾</span><button class="smallbtn" onclick="simulateNoShow()">模拟超时未签到</button></div></div><div class="adm-message">点击“模拟超时未签到”，将最早一条待签到记录变更为“已违约”，释放座位并生成违约记录，供业务闭环演示。</div><table class="data-table"><thead><tr><th>预约编号</th><th>学生</th><th>预约场馆</th><th>座位</th><th>预约日期</th><th>时段</th><th>状态</th></tr></thead><tbody>${all.map(b=>`<tr><td style="color:#256ad9">${b.id}</td><td>${b.user}</td><td>${rooms.find(x=>x.id===b.roomId)?.short||'-'}</td><td>${b.seat}</td><td>${b.date}</td><td>${b.slot}</td><td>${statusPill(b.status)}</td></tr>`).join('')}</tbody></table><div class="pagination"><span>共 ${all.length} 条预约记录</span><span>测试环境 · 本地模拟数据</span></div></div>`;return adminShell('预约记录管理',content)}
function simulateNoShow(){let b=data.bookings.find(x=>x.status==='reserved');if(!b){toast('当前没有待签到记录可模拟');return}b.status='no_show';data.violations.push({id:'V-'+String(Date.now()).slice(-5),user:b.user,seat:b.seat,room:rooms.find(r=>r.id===b.roomId)?.building,date:b.date,reason:'超时15分钟未签到',score:1,status:'待处理'});save();toast('已模拟超时未签到：预约失效，生成违约记录')}
function violation(){let vs=data.violations;let content=`<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><span>累计违约记录</span><strong>${pad(vs.length)}</strong><small>示例规则 · 30日累计</small></div><div class="kpi"><span>待处理</span><strong>${pad(vs.filter(x=>x.status==='待处理').length)}</strong><small>需管理员复核</small></div><div class="kpi"><span>已核实</span><strong>${pad(vs.filter(x=>x.status==='已核实').length)}</strong><small>产生1次违约记分</small></div></div><div class="tablepanel"><div class="tablebar"><h3>违约事件记录</h3><div class="inputs"><button class="smallbtn" onclick="go('bookAdmin')">前往预约管理 ↗</button></div></div><div class="adm-message">违约规则示例：预约开始15分钟后仍未签到 → 自动失效并计1分；30天累计3分 → 限制预约7天。封禁逻辑为PRD设计，不在本地原型中模拟账户体系。</div><table class="data-table"><thead><tr><th>事件编号</th><th>学生</th><th>座位</th><th>日期</th><th>违约原因</th><th>状态</th><th>操作</th></tr></thead><tbody>${vs.map(v=>`<tr><td>${v.id}</td><td>${v.user}</td><td>${v.seat}</td><td>${v.date}</td><td>${v.reason}</td><td>${v.status==='待处理'?'<span class="pill warn">待处理</span>':'<span class="pill">已核实</span>'}</td><td><button class="smallbtn" onclick="reviewViolation('${v.id}')" ${v.status==='已核实'?'disabled':''}>${v.status==='已核实'?'已完成':'确认处理'}</button></td></tr>`).join('')}</tbody></table><div class="pagination"><span>显示 ${vs.length} 条违约记录</span><span>学生申诉流程：后续迭代 P1</span></div></div>`;return adminShell('违约记录管理',content)}
function reviewViolation(id){let v=data.violations.find(x=>x.id===id);if(!v)return;v.status='已核实';save();toast('违约记录已标记为核实完成')}
const renderPage={home,rooms:roomsPage,detail,seats,confirm,bookings,checkin,history,dashboard,seatAdmin,bookAdmin,violation};
function render(){let isAdmin=adminPages.some(x=>x[0]===ui.page);let all=[...studentPages,...adminPages], meta=all.find(x=>x[0]===ui.page);document.getElementById('app').innerHTML=`<div class="app"><aside class="rail"><div class="brand"><div class="brand-icon">▣</div><div><strong>座有序</strong><small>PRODUCT PORTFOLIO · V1.0</small></div></div><div class="rail-label">学生端 / MOBILE APP</div>${studentPages.map(([key,num,title])=>`<button class="rail-btn ${ui.page===key?'active':''}" onclick="go('${key}')"><span class="rail-number">${num}</span><span>${title}</span></button>`).join('')}<div class="rail-label">管理端 / WEB CONSOLE</div>${adminPages.map(([key,num,title])=>`<button class="rail-btn ${ui.page===key?'active':''}" onclick="go('${key}')"><span class="rail-number">${num}</span><span>${title}</span></button>`).join('')}<div class="rail-bottom"><p>12 个独立页面 · 可点击状态交互<br>模拟项目，仅供求职作品展示</p><button class="reset" onclick="if(confirm('确认重置预约、座位及违约记录？')){data=seeded();save();ui.page='home';ui.selected='A03';render()}">↻ 重置演示数据</button></div></aside><section class="workspace"><div class="topbar"><div><div class="crumb">作品集 / ${isAdmin?'管理员后台':'学生端原型'} / 画面 ${meta[1]}</div><h1>${meta[2]}</h1></div><div class="top-actions"><span class="chip">◉ 离线可交互原型</span><button class="ghost" onclick="go('${isAdmin?'home':'dashboard'}')">切换${isAdmin?'学生端':'管理端'} ↗</button></div></div><main class="main"><section class="stage">${isAdmin?renderPage[ui.page]():`<div class="phone-border"><div class="phone" id="capture-target"><div class="phone-top"><span>9:41</span><span>●●● ▰</span></div><div class="screen-app">${renderPage[ui.page]()}</div></div></div>`}</section>${isAdmin?`<aside class="help-panel admin-help"><div class="panel"><h3>管理端设计说明</h3><p>角色：自习室管理员 / 教务管理人员</p><h4>当前页面重点</h4><div class="aside-step">${meta[2]}</div><p>侧边栏可切换管理模块。状态数据与学生端本地共享。</p><h4>演示建议</h4><ul><li>在预约管理中模拟超时违约</li><li>在座位管理中尝试停用有预约的座位</li><li>在违约管理中核实处理</li></ul></div></aside>`:`<aside class="help-panel"><div class="panel"><h3>当前原型画面</h3><p><b style="color:#2768e8">${meta[1]} / 12</b>　${meta[2]}</p><h4>交互路径</h4><div class="aside-step">首页 → 场馆 → 选座 → 确认</div><div class="aside-step">我的预约 → 模拟签到 → 释放</div><h4>设计意图</h4><p>以最少步骤完成选座与预约；关键状态通过视觉区分，异常时给出明确反馈。</p><h4>PRD 规则</h4><ul><li>同一时段不可重复预约</li><li>座位冲突时阻止提交</li><li>预约失效释放座位</li></ul></div><div class="panel"><h3>原型使用说明</h3><p>点击真实控件切换页面。数据存入本地浏览器，重置按钮可以恢复测试用例。</p></div></aside>`}</main></section>${ui.toast?`<div class="toast">${ui.toast}</div>`:''}</div>`}
render();
</script></body></html>
